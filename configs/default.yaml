n_workers: 15

random_seed: 42

image_size: 64

cnn_autoencoder:
  epochs: 150
  batch_size: 64
  patience: 15
  min_delta: 1e-4
  val_split: 0.2
  learning_rate: 1e-3
  latent_dim: 128

resnet18_autoencoder_frozen:
  epochs: 100
  batch_size: 64
  patience: 10
  min_delta: 1e-4
  val_split: 0.2
  learning_rate: 1e-3
  latent_dim: 128

resnet18_autoencoder_progressive_unfreeze:
  epochs: 150
  batch_size: 64
  patience: 10
  min_delta: 1e-4
  val_split: 0.2
  learning_rate: 1e-3
  latent_dim: 128
  unfreeze_epoch: 20

resnet18_autoencoder_differential_lr:
  epochs: 100
  batch_size: 64
  patience: 10
  min_delta: 1e-4
  val_split: 0.2
  learning_rate: 1e-3
  latent_dim: 128
  encoder_lr: 1e-4
  decoder_lr: 1e-3

pvt_autoencoder_frozen:
